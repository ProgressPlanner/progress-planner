name: Code Coverage (Grouped)

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-matrix:
    name: Coverage - ${{ matrix.group }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        group:
          - activities
          - badges
          - admin
          - api
          - suggested-tasks-providers-1
          - suggested-tasks-providers-2
          - suggested-tasks-providers-3
          - suggested-tasks-providers-4
          - suggested-tasks-data-collectors-1
          - suggested-tasks-data-collectors-2
          - suggested-tasks-data-collectors-3
          - goals
          - updates
          - ui
          - utils
          - misc

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=10s --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: memory_limit=512M
          coverage: xdebug
          tools: composer

      - name: Install SVN
        run: sudo apt-get install subversion

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v2
        with:
          dependency-versions: "highest"
          composer-options: "--prefer-dist"

      - name: Install WordPress Test Suite
        shell: bash
        run: tests/bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1:3306 latest

      - name: Run PHPUnit with coverage for group
        run: |
          echo "Running coverage for group: ${{ matrix.group }}"

          # Run PHPUnit with coverage using the group annotation
          set +e
          php -d memory_limit=512M \
            vendor/bin/phpunit \
            --coverage-clover=coverage-${{ matrix.group }}.xml \
            --coverage-text \
            --group "${{ matrix.group }}"
          EXIT_CODE=$?
          set -e

          echo "PHPUnit exit code: $EXIT_CODE"

          # Check if coverage was generated
          if [ -f coverage-${{ matrix.group }}.xml ]; then
            echo "✓ Coverage generated for ${{ matrix.group }}"
            ls -lh coverage-${{ matrix.group }}.xml
          else
            echo "✗ Coverage NOT generated for ${{ matrix.group }}"
            exit 1
          fi

      - name: Upload coverage for group
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}
          path: coverage-${{ matrix.group }}.xml
          retention-days: 1

  merge-coverage:
    name: Merge & Report Coverage
    needs: coverage-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: List downloaded coverage files
        run: |
          echo "Downloaded coverage files:"
          ls -lh coverage-*.xml

      - name: Install phpcov for merging
        run: composer global require phpunit/phpcov

      - name: Merge coverage reports
        run: |
          # Merge all coverage XML files
          ~/.composer/vendor/bin/phpcov merge \
            --clover=coverage.xml \
            --text \
            .

          echo "Merged coverage file:"
          ls -lh coverage.xml

      - name: Generate coverage summary
        id: coverage
        run: |
          if [ ! -f coverage.xml ]; then
            echo "current_coverage=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract coverage percentage from Clover XML
          LINES=$(grep -o 'statements="[0-9]*"' coverage.xml | head -1 | grep -o '[0-9]*')
          COVERED=$(grep -o 'coveredstatements="[0-9]*"' coverage.xml | head -1 | grep -o '[0-9]*')

          if [ -n "$LINES" ] && [ -n "$COVERED" ] && [ "$LINES" -gt 0 ]; then
            COVERAGE=$(awk "BEGIN {printf \"%.2f\", ($COVERED/$LINES)*100}")
          else
            COVERAGE="0"
          fi

          echo "current_coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Current code coverage: $COVERAGE%"

      - name: Checkout base branch for comparison
        if: github.event_name == 'pull_request'
        run: |
          cp coverage.xml /tmp/current-coverage.xml
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}

      - name: Install dependencies on base branch
        if: github.event_name == 'pull_request'
        run: composer install --no-interaction --prefer-dist

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const current = '${{ steps.coverage.outputs.current_coverage }}';
            const diff = parseFloat(current);
            const emoji = diff >= 50 ? '📈' : diff >= 30 ? '📊' : '📉';
            const status = '✅';

            const comment = `## ${status} Code Coverage Report (Grouped)

            | Metric | Value |
            |--------|-------|
            | Current Coverage | **${current}%** ${emoji} |

            Coverage collected by running tests in groups to avoid timeout/crash issues.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
            `;

            const {data: comments} = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Code Coverage Report (Grouped)')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Upload merged coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage.xml
          retention-days: 30
