name: 'WordPress.org Plugin Check'
on: # rebuild any PRs and main branch changes
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: '8.3'
            coverage: none
            tools: wp-cli

        # Do NOT switch to the WP-CLI nightly here. It reports itself as
        # wp-cli 3.0.0-alpha, while every released dist-archive-command
        # requires wp-cli ^2 / ^2.13, so the install below fails to resolve.
        # The nightly was previously used to dodge Composer rejecting the
        # GitHub Actions token ("contains invalid characters",
        # https://github.com/composer/composer/issues/12076); that bug is
        # fixed since Composer 2.10.0, which the stable phar now bundles.
        # Pinned to v3.1.0 deliberately: it is the newest release that still
        # accepts wp-cli ^2. v3.2.x requires wp-cli ^2.13, which has no stable
        # release yet (latest stable is 2.12.0), so it cannot resolve here.
        - name: Install latest version of dist-archive-command
          run: wp package install wp-cli/dist-archive-command:v3.1.0

        - name: Build plugin
          run: |
            wp dist-archive . ./${{ github.event.repository.name }}.zip
            mkdir build
            unzip ${{ github.event.repository.name }}.zip -d build

        # v1.1.7 fixed the wp-env silent-startup failure ("Environment not
        # initialized. Run `wp-env start` first.") that broke this job on newer
        # runner images; v1.1.9 fixes a bundle regression in v1.1.8. Because
        # that fix landed upstream, @wordpress/env needs no version pin here.
        # https://github.com/WordPress/plugin-check-action/pull/590
        - name: Run plugin check
          uses: wordpress/plugin-check-action@v1.1.9
          with:
            build-dir: './build/${{ github.event.repository.name }}'
            exclude-checks: |
              direct_file_access
