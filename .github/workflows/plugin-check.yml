name: 'WordPress.org Plugin Check'
on: # rebuild any PRs and main branch changes
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: '8.3'
            coverage: none
            tools: wp-cli

        # dist-archive-command is a PUBLIC package, so this install needs no
        # GitHub auth at all. Both env vars below are cleared because Composer
        # intermittently rejects the ephemeral Actions token with "Your github
        # oauth token for github.com contains invalid characters" — it depends
        # on the characters in the token minted for that particular run, so the
        # job fails at random (see composer#12076). wp-cli reads GITHUB_TOKEN
        # itself, and setup-php separately exports the same token via
        # COMPOSER_AUTH; clearing only one of the two leaves the other to
        # reintroduce the bad token, which is why earlier single-var attempts
        # appeared to work and then regressed.
        #
        # Do NOT switch to the WP-CLI nightly to dodge this: it reports as
        # wp-cli 3.0.0-alpha, and every released dist-archive-command requires
        # wp-cli ^2 / ^2.13, so the install cannot resolve against it.
        #
        # Pinned to v3.1.0 deliberately: newest release accepting wp-cli ^2.
        # v3.2.x requires ^2.13, which has no stable release (latest is 2.12.0).
        # `unset` rather than setting them to '': wp-cli configures the token
        # whenever getenv() returns a string, and an empty string still is one.
        # Unsetting makes getenv() return false so the token is never written.
        - name: Install latest version of dist-archive-command
          run: |
            unset GITHUB_TOKEN COMPOSER_AUTH
            wp package install wp-cli/dist-archive-command:v3.1.0

        - name: Build plugin
          run: |
            wp dist-archive . ./${{ github.event.repository.name }}.zip
            mkdir build
            unzip ${{ github.event.repository.name }}.zip -d build

        # v1.1.7 fixed the wp-env silent-startup failure ("Environment not
        # initialized. Run `wp-env start` first.") that broke this job on newer
        # runner images; v1.1.9 fixes a bundle regression in v1.1.8. Because
        # that fix landed upstream, @wordpress/env needs no version pin here.
        # https://github.com/WordPress/plugin-check-action/pull/590
        - name: Run plugin check
          uses: wordpress/plugin-check-action@v1.1.9
          with:
            build-dir: './build/${{ github.event.repository.name }}'
            exclude-checks: |
              direct_file_access
